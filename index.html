<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Document</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        background-color: #080b08;
        font-family: "Courier New", monospace;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        width: 100%;
        padding: 14px 20px;
        box-sizing: border-box;
        background-color: #111a12;
        border-bottom: 2px solid #697850;
        box-shadow: 0 4px 0 #050705;
      }

      header ul {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      header li {
        margin: 0;
      }

      header button {
        min-width: 120px;
        padding: 10px 18px;
        color: #d7e7c8;
        background-color: #183b07;
        border: 2px solid #697850;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 3px 3px 0 #050705;
        transition:
          background-color 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease,
          filter 0.2s ease,
          box-shadow 0.2s ease;
      }

      header button:hover {
        color: #183b07;
        background-color: #b7d391;
        transform: translateY(-2px);
        box-shadow: 3px 5px 0 #050705;
      }

      header button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #050705;
        filter: brightness(50%);
      }

      canvas {
        background-color: rgb(74, 96, 96);
        width: clamp(100px, 90dvw, 500px);
        height: clamp(100px, 90dvw, 500px);
        display: block;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <header>
      <ul>
        <li><button onclick="play()">PLAY</button></li>
        <li><button onclick="pausa()">PAUSED</button></li>
      </ul>
    </header>
    <canvas></canvas>
    <script src="script.js"></script>
  </body>
</html>
