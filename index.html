<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="shortcut icon" href="img/gameLifeIco.png" type="image/x-icon" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <title>El Juego De La Vida</title>
  </head>
  <body>
    <header>
      <ul>
        <li>
          <button id="playButton" onclick="play()" aria-pressed="false">
            PLAY
          </button>
        </li>
        <li>
          <button id="pauseButton" onclick="pausa()" aria-pressed="true">
            PAUSED
          </button>
        </li>
        <li><button onclick="updateGeneration()">NEXT</button></li>
        <li><button onclick="previusGeneration()">BACK</button></li>
        <li><button onclick="cleanTable()">CLEAN</button></li>
        <li>
          <select id="orientationSelect" name="select">
            <option value="1" selected>0deg</option>
            <option value="2">90deg</option>
            <option value="3">180deg</option>
            <option value="4">270deg</option>
          </select>
        </li>
        <li>
          <select id="patternSelect" name="select"></select>
        </li>
        <li class="status-group">
          <span id="infoPopulation">POPULATION: 00</span>
          <span id="infoGeneration">GENERATION: 00</span>
        </li>
      </ul>
    </header>
    <canvas></canvas>
    <script src="js/UI/interaction.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
